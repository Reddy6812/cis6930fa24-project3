<!DOCTYPE html>
<html lang="en">
<head>
    <title>Upload Incident Reports</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            background-color: #000;
            color: #00ff00;
            overflow: hidden;
        }
        h1 {
            text-align: center;
            color: #00ff00;
            z-index: 10;
            position: relative;
            margin-top: 50px;
        }
        form {
            margin: auto;
            max-width: 500px;
            padding: 20px;
            border: 2px solid #00ff00;
            border-radius: 8px;
            background: rgba(17, 17, 17, 0.9);
            box-shadow: 0 4px 10px rgba(0, 255, 0, 0.4);
            z-index: 10;
            position: relative;
        }
        label {
            font-weight: bold;
            color: #00ff00;
        }
        textarea, input, select {
            width: 100%;
            margin: 10px 0;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #00ff00;
            border-radius: 5px;
            background-color: #111;
            color: #00ff00;
        }
        button {
            background-color: #00ff00;
            color: #111;
            padding: 10px 15px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            display: block;
            margin: auto;
            font-weight: bold;
        }
        button:hover {
            background-color: #00cc00;
        }
        .preview-section {
            margin: auto;
            max-width: 800px;
            margin-top: 30px;
            text-align: center;
            z-index: 10;
            position: relative;
        }
        .preview-section h2 {
            color: #00ff00;
        }
        .preview-images {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }
        .preview-images img {
            width: 200px;
            height: auto;
            border: 2px solid #00ff00;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 255, 0, 0.4);
        }
        img:hover {
            transform: scale(1.05);
            transition: all 0.3s ease-in-out;
        }
        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }
        .welcome-message {
            font-size: 24px;
            font-weight: bold;
            color: #00ff00;
            text-align: center;
            margin-top: 20px;
            animation: blink 2s infinite;
        }
        @keyframes blink {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <h1>Upload Incident Reports</h1>
    <div class="welcome-message">Welcome to Gator Nation</div>
    <form method="POST" enctype="multipart/form-data">
        <label for="urls">Enter Incident Report URLs (one per line):</label>
        <textarea name="urls" rows="5" cols="50" placeholder="https://example.com/report1.pdf"></textarea><br>
        
        <label for="files">Or Upload Incident Report PDFs:</label>
        <input type="file" name="files" multiple><br>

        <button type="submit">Submit</button>
    </form>

    <div class="preview-section">
        <h2>Visualization Previews</h2>
        <div class="preview-images">
            <img src="static/incident_bar_graph.png" alt="Bar Chart Preview" title="Bar Chart">
            <img src="static/incident_scatter_plot.png" alt="Scatter Plot Preview" title="Scatter Plot">
            <img src="static/incident_heatmap.png" alt="Heatmap Preview" title="Heatmap">
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Set up the scene
        const scene = new THREE.Scene();

        // Set up the camera
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 5;

        // Set up the renderer
        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Create a particle system
        const particleCount = 1000;
        const particles = new THREE.BufferGeometry();
        const particlePositions = new Float32Array(particleCount * 3);

        for (let i = 0; i < particleCount; i++) {
            particlePositions[i * 3] = (Math.random() - 0.5) * 20;
            particlePositions[i * 3 + 1] = (Math.random() - 0.5) * 20;
            particlePositions[i * 3 + 2] = (Math.random() - 0.5) * 20;
        }

        particles.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));

        const particleMaterial = new THREE.PointsMaterial({
            color: 0x00ff00,
            size: 0.1,
            transparent: true,
            opacity: 0.8,
        });

        const particleSystem = new THREE.Points(particles, particleMaterial);
        scene.add(particleSystem);

        // Create shooting stars
        const shootingStars = [];
        const createShootingStar = () => {
            const starGeometry = new THREE.SphereGeometry(0.05, 8, 8);
            const starMaterial = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
            const star = new THREE.Mesh(starGeometry, starMaterial);
            star.position.set((Math.random() - 0.5) * 10, 5, 0);
            scene.add(star);
            shootingStars.push({ star, speed: Math.random() * 0.05 + 0.02 });
        };

        setInterval(createShootingStar, 1000);

        // Mouse interaction
        const mouse = new THREE.Vector2();

        window.addEventListener('mousemove', (event) => {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            for (let i = 0; i < particleCount; i++) {
                const dx = particlePositions[i * 3] - mouse.x * 5;
                const dy = particlePositions[i * 3 + 1] - mouse.y * 5;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < 1) {
                    particlePositions[i * 3] += dx * 0.05;
                    particlePositions[i * 3 + 1] += dy * 0.05;
                }
            }

            particles.attributes.position.needsUpdate = true;
        });

        // Animate the scene
        function animate() {
            requestAnimationFrame(animate);

            // Update particle system rotation
            particleSystem.rotation.y += 0.002;

            // Update shooting stars
            for (let i = shootingStars.length - 1; i >= 0; i--) {
                shootingStars[i].star.position.y -= shootingStars[i].speed;
                if (shootingStars[i].star.position.y < -5) {
                    scene.remove(shootingStars[i].star);
                    shootingStars.splice(i, 1);
                }
            }

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
